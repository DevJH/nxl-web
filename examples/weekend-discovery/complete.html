<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>예약 완료 · 주말의 발견</title><style>@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');*{box-sizing:border-box}body{margin:0;background:#fff;color:#242825;font:14px/1.6 'Pretendard Variable',sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}h1,h2,p{margin:0}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #eceee9}header strong{font-size:17px;letter-spacing:-.7px}header span{font-size:11px;color:#5c655d}.back{font-size:22px;line-height:1}main{padding:26px 24px 30px;max-width:520px;margin:auto}.kicker{font-size:11px;color:#7b523c;margin-bottom:8px}h1{font-size:28px;line-height:1.3;letter-spacing:-1.25px;font-weight:650}.intro{color:#667068;font-size:12px;line-height:1.7;margin-top:12px}img{width:100%;display:block;object-fit:cover}.hero{margin-top:25px;position:relative;border-radius:8px;overflow:hidden;background:#eeebdf}.hero img{height:242px;object-position:center 25%}.hero-copy{padding:19px 18px 20px}.hero-copy span{font-size:10px;color:#7b523c}.hero-copy h2{font-size:22px;letter-spacing:-.8px;margin-top:4px}.meta{font-size:11px;color:#667068;margin-top:6px}.tabs{display:flex;gap:8px;margin-top:24px}.tabs a{border:1px solid #e2e7df;padding:7px 12px;border-radius:30px;font-size:11px}.tabs a.active{background:#29362e;color:#fff;border-color:#29362e}.subheading{font-size:18px;margin:27px 0 12px;letter-spacing:-.6px}.small-card{display:flex;gap:13px;align-items:center;padding:13px 0;border-top:1px solid #e7ebe4}.small-card img{width:70px;height:66px;border-radius:5px}.small-card h2{font-size:15px;line-height:1.5}.small-card p{font-size:11px;color:#667068;margin-top:4px}.arrow{margin-left:auto;font-size:18px}.detail-cover{margin-top:0;border-radius:7px;height:242px;object-position:50% 28%}.tag{display:inline-block;margin-top:21px;font-size:10px;color:#7b523c;background:#f3ece4;padding:4px 8px;border-radius:3px}.detail-title{margin-top:10px}.details{display:grid;gap:12px;margin:24px 0 22px;padding:20px 0;border-block:1px solid #e5e9e2}.details div{display:flex;gap:20px;justify-content:space-between;font-size:12px}.details dt{color:#667068}.details dd{margin:0;text-align:right}.cta{display:flex;justify-content:center;align-items:center;gap:14px;background:#29362e;color:white;padding:14px;border:0;width:100%;border-radius:5px;font-size:13px;font-weight:550;margin-top:24px;min-height:48px}.cta.secondary{background:white;color:#29362e;border:1px solid #dae0d7}.fine{font-size:10px;text-align:center;color:#687267;margin-top:14px}.selected-exhibit{display:flex;gap:14px;align-items:center;background:#f5f5f0;padding:14px;border-radius:6px;margin-top:22px}.selected-exhibit img{height:68px;width:64px;border-radius:3px}.selected-exhibit strong{font-size:14px}.selected-exhibit p{font-size:11px;color:#667068}.month{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:23px 0 13px;font-size:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar span{font-size:10px;color:#667068;padding:5px 0}.calendar button{font-size:12px;aspect-ratio:1;border:none;background:#fff;border-radius:50%;color:#364036}.calendar button:disabled{color:#b7beb4;cursor:default}.calendar button[aria-pressed=true]{background:#29362e;color:white}.time-label{display:block;font-size:12px;font-weight:550;margin:19px 0 9px}.times{display:flex;gap:10px}.times button{background:white;border:1px solid #dfe5db;padding:8px 18px;font-size:12px;border-radius:4px;color:#364036}.times button[aria-pressed=true]{border-color:#29362e;background:#f0f3ed}.check{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#edf2e8;color:#33513d;margin:8px 0 25px}.check svg{width:26px;height:26px}.ticket{margin-top:27px;border:1px solid #dee4d9;border-radius:8px;overflow:hidden}.ticket-head{padding:18px 19px;background:#f2f4ed}.ticket-head>p{font-size:10px;color:#64705f}.ticket-head>strong{display:block;font-size:19px;letter-spacing:-.7px;margin-top:5px}.ticket-body{padding:5px 19px 21px}.ticket-body .details{border-top:0;margin:0 0 17px;padding-block:17px}.ticket-code{font-size:12px;letter-spacing:.16em;font-weight:550;text-align:center}.route-note{font-size:12px;line-height:1.7;color:#667068;margin-top:22px}a:focus-visible,button:focus-visible{outline:2px solid #984b35;outline-offset:3px}@media(min-width:600px){body{background:#f2f3ee}header,main{max-width:440px;background:white;margin:auto}header{margin-top:32px}main{min-height:740px}}</style></head><body><header><a class="back" href="index.html" aria-label="이전 화면">‹</a><strong>예약 내역</strong><span>예제</span></header><main><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4 4L19 6"/></svg></div><p class="kicker">기다려지는 주말이 생겼어요</p><h1>방문 준비가<br>끝났습니다.</h1><p class="intro">선택한 일정과 장소를 확인해 주세요.<br>예매 정보는 예약 내역에서 다시 볼 수 있어요.</p><div class="ticket"><div class="ticket-head"><p>WEEKEND DISCOVERY</p><strong>빛과 색 사이의 오후</strong></div><div class="ticket-body"><dl class="details"><div><dt>방문 일시</dt><dd data-reservation-date>2026. 10. 10 · 14:00</dd></div><div><dt>관람 인원</dt><dd>성인 1명</dd></div><div><dt>장소</dt><dd>성수 · 작은 갤러리</dd></div></dl><p class="ticket-code">DEMO — 1010 — 01</p></div></div><p class="route-note">선택한 시간 10분 전까지 도착해 주세요.<br>현장에서 예약 내역을 보여주시면 됩니다.</p><a class="cta" href="index.html">다른 경험 둘러보기 <span>→</span></a><p class="fine">서비스 소개용 예제 예약입니다.</p></main><script>const days=[...document.querySelectorAll('[data-day]')];days.forEach(b=>b.onclick=()=>{days.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));try{sessionStorage.setItem('weekend-day',b.textContent)}catch{}});const times=[...document.querySelectorAll('[data-time]')];times.forEach(b=>b.onclick=()=>{times.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));try{sessionStorage.setItem('weekend-time',b.textContent)}catch{}});document.querySelectorAll('[data-reservation-date]').forEach(e=>{try{e.textContent='2026. 10. '+(sessionStorage.getItem('weekend-day')||'10')+' · '+(sessionStorage.getItem('weekend-time')||'14:00')}catch{}});</script></body></html>
