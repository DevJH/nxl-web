.setItem('weekend-time',b.textContent)}catch{}});document.querySelectorAll('[data-reservation-date]').forEach(e=>{try{e.textContent='2026. 10. '+(sessionStorage.getItem('weekend-day')||'10')+' · '+(sessionStorage.getItem('weekend-time')||'14:00')}catch{}});</script></body></html>
