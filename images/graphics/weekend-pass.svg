<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">주말 전시를 위한 두 장의 패스</title>
  <desc id="desc">보라색 곡선 그래픽 카드 위에 크림색 전시 패스가 겹쳐진 SVG 구성 예시. 패스에는 Weekend라는 제목과 오렌지색 원형 그래픽, 입장권 바코드가 있습니다.</desc>
